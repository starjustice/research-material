# kind cluster config — 1 control-plane node + 2 worker nodes.
#
# Why 3 nodes? So you can SEE the scheduler spread pods across machines
# (kubectl get pods -o wide shows a NODE column). A 1-node cluster hides that.
#
# extraPortMappings: kind runs Kubernetes nodes as Docker containers, so the
# cluster is normally unreachable from your browser. This maps
#   your laptop's localhost:8080  ->  node port 30080 inside the cluster
# which is what our NodePort Service listens on.
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: orchestration-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # the NodePort our Service opens on every node
        hostPort: 8080         # what you type in the browser: http://localhost:8080
        protocol: TCP
  - role: worker
  - role: worker
