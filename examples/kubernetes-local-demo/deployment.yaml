# VERSION 1 of the app.
#
# A Deployment is the object you write. It creates a ReplicaSet, which keeps
# `replicas` pods alive. Change anything under `template:` and the Deployment
# starts a rolling update to a NEW ReplicaSet, keeping the old one for rollback.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2                       # desired state: 2 pods, always

  selector:
    matchLabels:
      app: web                      # which pods this Deployment owns

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                   # may run 1 EXTRA pod during a rollout
      maxUnavailable: 0             # never drop below 2 healthy pods -> no capacity loss

  template:                         # ---- the pod blueprint ----
    metadata:
      labels:
        app: web                    # must match the selector above
        version: v1
    spec:
      terminationGracePeriodSeconds: 20   # time to finish in-flight requests after SIGTERM

      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80

          # ---- resources ----
          # requests = what the SCHEDULER reserves when picking a node.
          # limits   = the hard ceiling. Memory over the limit -> OOMKilled (exit 137).
          #            CPU over the limit -> throttled (slow), not killed.
          resources:
            requests:
              cpu: 50m              # 50m = 0.05 of one CPU core
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi

          # ---- readiness: "can this pod serve traffic RIGHT NOW?" ----
          # Failure = pod is removed from the Service endpoints. No restart.
          # This is what makes the rolling update zero-downtime.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2

          # ---- liveness: "is this container broken beyond recovery?" ----
          # Failure = kubelet KILLS and restarts the container.
          # Keep it dependency-free: never check the database here.
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html

      volumes:
        - name: site
          configMap:
            name: site-v1           # <-- version 1 content
