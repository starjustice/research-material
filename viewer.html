<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note — Study Hub</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg: #faf6ee; --card: #fff; --ink: #1e3a4c; --muted: #6b7a86;
    --accent: #f5c542; --blue-soft: #dbeafe; --border: #e6dfd2;
    --code-bg: #1e2a33; --code-ink: #d9e6ee; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); margin: 0 auto; max-width: 780px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 14px 16px 70px; line-height: 1.6;
  }
  nav {
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 5;
    border-bottom: 1px solid var(--border); margin-bottom: 14px;
  }
  nav a { color: var(--ink); font-weight: 600; text-decoration: none; font-size: .9rem; }
  nav a.gh { color: var(--muted); font-weight: 500; font-size: .8rem; }
  article h1 { font-size: 1.45rem; line-height: 1.3; margin: 10px 0 14px; }
  article h2 {
    font-size: 1.15rem; margin: 28px 0 10px; padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
  }
  article h3 { font-size: 1rem; margin: 20px 0 8px; }
  article p, article li { font-size: .95rem; }
  article ul, article ol { padding-left: 22px; }
  article li { margin-bottom: 4px; }
  article blockquote {
    background: #fff8e1; border-left: 4px solid var(--accent); border-radius: 8px;
    padding: 10px 14px; margin: 12px 0; font-size: .9rem;
  }
  article blockquote p { margin: 0; }
  article code {
    background: #efe9db; border-radius: 4px; padding: 1px 5px;
    font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: .84em;
  }
  article pre {
    background: var(--code-bg); color: var(--code-ink); border-radius: var(--radius);
    padding: 14px; overflow-x: auto; font-size: .8rem; line-height: 1.5; margin: 12px 0;
  }
  article pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
  article table {
    border-collapse: collapse; width: 100%; margin: 12px 0; background: var(--card);
    border-radius: var(--radius); overflow: hidden; font-size: .85rem;
    display: block; overflow-x: auto;
  }
  article th, article td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
  article th { background: var(--blue-soft); }
  article a { color: #2563eb; }
  .mermaid {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; margin: 12px 0; text-align: center; overflow-x: auto;
  }
  .mermaid svg { max-width: 100%; height: auto; }
  .error {
    background: #fbe4e8; border-left: 4px solid #e06377; border-radius: 8px;
    padding: 12px 14px; font-size: .9rem;
  }
</style>
</head>
<body>

<nav>
  <a href="index.html">← Study Hub</a>
  <a class="gh" id="ghLink" href="#" target="_blank" rel="noopener">View on GitHub ↗</a>
</nav>

<article id="content"><p>Loading note…</p></article>

<script>
(async function () {
  const content = document.getElementById("content");
  const slug = new URLSearchParams(location.search).get("note") || "";

  // Only allow simple note filenames — no paths, no tricks.
  if (!/^[a-z0-9][a-z0-9-]*$/.test(slug)) {
    content.innerHTML = '<div class="error">No note selected. Go back to the Study Hub and pick one.</div>';
    return;
  }

  document.getElementById("ghLink").href =
    "https://github.com/starjustice/research-material/blob/main/notes/" + slug + ".md";

  let md;
  try {
    const res = await fetch("notes/" + slug + ".md");
    if (!res.ok) throw new Error("HTTP " + res.status);
    md = await res.text();
  } catch (e) {
    content.innerHTML = '<div class="error">Could not load this note (' + e.message + '). Check the link or try the GitHub view.</div>';
    return;
  }

  content.innerHTML = marked.parse(md);

  // Turn ```mermaid code blocks into rendered diagrams.
  content.querySelectorAll("pre code.language-mermaid").forEach(el => {
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = el.textContent;
    el.closest("pre").replaceWith(div);
  });

  // Make relative note links (e.g. other-note.md) work inside the viewer.
  content.querySelectorAll('a[href$=".md"]').forEach(a => {
    const href = a.getAttribute("href");
    if (!/^https?:\/\//.test(href)) {
      a.href = "viewer.html?note=" + href.replace(/\.md$/, "").replace(/^notes\//, "");
    }
  });

  const h1 = content.querySelector("h1");
  if (h1) document.title = h1.textContent + " — Study Hub";

  mermaid.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "loose" });
  await mermaid.run({ querySelector: ".mermaid" });
})();
</script>

</body>
</html>
